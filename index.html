<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>For My Aya ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #030303; background-image: radial-gradient(circle at 20% 20%, rgba(255, 77, 148, 0.08) 0%, transparent 40%), linear-gradient(135deg, #090005 0%, #030303 100%); color: #fff; font-family: 'Poppins', sans-serif; text-align: center; overflow-x: hidden; padding-bottom: 50px; }

        .falling-element { position: fixed; top: -50px; font-size: 22px; animation: fall linear infinite; z-index: 1; pointer-events: none; }
        @keyframes fall { 0% { transform: translateY(-5vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

        .heart-wrapper { position: relative; width: 300px; height: 300px; margin: 60px auto 20px; display: flex; justify-content: center; align-items: center; animation: heartbeat 1.5s infinite ease-in-out; z-index: 2; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .heart-text { position: absolute; font-family: 'Great Vibes', cursive; font-size: 1.6rem; color: #ff4d94; text-shadow: 0 0 10px #ff4d94; white-space: nowrap; transition: 0.5s; }

        .aya-name { font-family: 'Great Vibes', cursive; font-size: 4rem; color: #ff4d94; margin-bottom: 20px; text-shadow: 0 0 30px #ff4d94; z-index: 2; position: relative; }
        
        .glass-section { background: rgba(20, 10, 15, 0.6); backdrop-filter: blur(15px); max-width: 600px; margin: 20px auto; padding: 30px; border-radius: 30px; border: 1px solid rgba(255, 77, 148, 0.3); z-index: 2; position: relative; }
        
        .media-grid { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
        .polaroid { background: #fff; color: #333; padding: 10px 10px 30px 10px; width: 180px; border-radius: 5px; }
        .polaroid img { width: 100%; height: 160px; object-fit: cover; }
        
        .video-box { width: 220px; height: 380px; border-radius: 20px; overflow: hidden; border: 2px solid rgba(255, 77, 148, 0.5); background: #000; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }

        .msg-btn { background: linear-gradient(45deg, #ff4d94, #ff758c); color: white; border: none; padding: 15px 40px; border-radius: 50px; cursor: pointer; font-family: 'Playfair Display', serif; font-size: 1.2rem; transition: 0.3s; }
        #msg-display { margin-top: 25px; font-size: 1.5rem; color: #fff; font-style: italic; font-family: 'Playfair Display', serif; min-height: 70px; }
    </style>
</head>
<body>

    <div id="elements-container"></div>
    <div class="heart-wrapper" id="heart"></div>
    <h1 class="aya-name">Aya ❤️</h1>

    <section class="glass-section">
        <h2>My Memories with You</h2>
        <div class="media-grid">
            <div class="polaroid"><img src="girl1.jpg"><p>Your smile</p></div>
            <div class="polaroid"><img src="girl2.jpg"><p>My princess</p></div>
        </div>
        <div class="media-grid">
            <div class="video-box"><video autoplay muted loop playsinline><source src="girl-video.mp4" type="video/mp4"></video></div>
            <div class="video-box"><video autoplay muted loop playsinline><source src="chat-video.mp4" type="video/mp4"></video></div>
        </div>
        <button class="msg-btn" onclick="nextMsg()">See another word for you</button>
        <div id="msg-display">"Every moment with you is a treasure, Aya..."</div>
    </section>

    <script>
        function createFallingElement() {
            const symbols = ['❤️', '🌹', '🌸', '💖', '🌷', '✨'];
            const el = document.createElement('div');
            el.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            el.className = 'falling-element';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.getElementById('elements-container').appendChild(el);
            setTimeout(() => el.remove(), 7000);
        }
        setInterval(createFallingElement, 400);

        const heart = document.getElementById('heart');
        for (let i = 0; i < 18; i++) {
            const span = document.createElement('span');
            span.className = 'heart-text';
            span.innerText = "I love you Aya";
            const angle = (i / 18) * Math.PI * 2;
            const x = 110 * Math.sin(angle);
            const y = -110 * Math.cos(angle);
            span.style.transform = `translate(${x}px, ${y}px) rotate(${angle}rad)`;
            heart.appendChild(span);
        }

        const msgs = [
            "Aya, you are the most beautiful chapter in my life. ❤️",
            "I don't just love you, I adore everything about you, Aya.",
            "Meeting you was fate, but loving you is my choice forever. 🌹",
            "Aya, your smile is the only light I need in my darkest days.",
            "If I had to live my life again, I would find you sooner! ✨"
        ];
        
        let idx = 0;
        function nextMsg() {
            document.getElementById('msg-display').innerText = msgs[idx];
            idx = (idx + 1) % msgs.length;
            document.querySelectorAll('.heart-text').forEach(el => {
                el.style.color = `hsl(${Math.random() * 360}, 70%, 70%)`;
            });
        }
    </script>
</body>
</html>
