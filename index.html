<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>For My Aya ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #030303; background-image: radial-gradient(circle, #1a050f 0%, #030303 100%); color: #fff; font-family: 'Poppins', sans-serif; text-align: center; overflow-x: hidden; padding-bottom: 50px; }

        /* تأثير السقوط المبهر */
        .falling-element { position: fixed; top: -50px; font-size: 25px; animation: fall linear infinite; z-index: 10; pointer-events: none; }
        @keyframes fall { 0% { transform: translateY(-5vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

        /* شاشة البداية */
        #intro-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 1s ease; }
        .enter-btn { background: #ff4d94; color: white; border: none; padding: 20px 60px; font-size: 1.5rem; border-radius: 50px; cursor: pointer; font-family: 'Great Vibes', cursive; box-shadow: 0 0 30px #ff4d94; }

        /* القلب النابض القريب */
        .heart-wrapper { position: relative; width: 250px; height: 250px; margin: 40px auto; display: flex; justify-content: center; align-items: center; animation: heartbeat 1.5s infinite ease-in-out; z-index: 2; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .heart-text { position: absolute; font-family: 'Great Vibes', cursive; font-size: 1.6rem; color: #ff4d94; text-shadow: 0 0 15px #ff4d94; white-space: nowrap; }

        .aya-name { font-family: 'Great Vibes', cursive; font-size: 4rem; color: #ff4d94; margin-bottom: 20px; text-shadow: 0 0 20px #ff4d94; z-index: 2; position: relative; }
        
        .video-box { width: 90%; max-width: 300px; margin: 20px auto; border-radius: 20px; overflow: hidden; border: 3px solid #ff4d94; box-shadow: 0 0 20px rgba(255, 77, 148, 0.5); background: #000; z-index: 2; position: relative; }
        .video-box video { width: 100%; display: block; }

        .msg-btn { background: #ff4d94; color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-size: 1.2rem; margin-top: 20px; z-index: 2; position: relative; }
        #msg-display { margin: 20px auto; font-size: 1.5rem; color: #fff; font-style: italic; max-width: 85%; font-family: 'Playfair Display', serif; z-index: 2; position: relative; }
    </style>
</head>
<body>

    <div id="intro-screen">
        <h1 style="font-family: 'Great Vibes', cursive; font-size: 3rem; margin-bottom: 20px;">Aya ❤️</h1>
        <button class="enter-btn" onclick="startExperience()">Open Your Gift</button>
    </div>

    <div id="elements-container"></div>
    <div class="heart-wrapper" id="heart"></div>
    <h1 class="aya-name">Aya ❤️</h1>

    <div class="video-box"><video autoplay muted loop playsinline><source src="girl-video.mp4" type="video/mp4"></video></div>
    <div class="video-box"><video autoplay muted loop playsinline><source src="chat-video.mp4" type="video/mp4"></video></div>

    <button class="msg-btn" onclick="nextMsg()">Press For Love</button>
    <div id="msg-display">"Press the button to see what my heart says, Aya..."</div>

    <script>
        function startExperience() {
            document.getElementById('intro-screen').style.opacity = '0';
            setTimeout(() => { document.getElementById('intro-screen').style.display = 'none'; }, 1000);
            setInterval(createFallingElement, 300);
        }

        function createFallingElement() {
            const symbols = ['❤️', '🌹', '🌸', '💖', '🌷', '✨'];
            const el = document.createElement('div');
            el.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            el.className = 'falling-element';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.getElementById('elements-container').appendChild(el);
            setTimeout(() => el.remove(), 6000);
        }

        const heart = document.getElementById('heart');
        for (let i = 0; i < 15; i++) {
            const span = document.createElement('span');
            span.className = 'heart-text';
            span.innerText = "I love you Aya";
            const angle = (i / 15) * Math.PI * 2;
            const x = 95 * Math.sin(angle);
            const y = -95 * Math.cos(angle);
            span.style.transform = `translate(${x}px, ${y}px) rotate(${angle}rad)`;
            heart.appendChild(span);
        }

        const msgs = ["Aya, you are the most beautiful chapter in my life. ❤️", "Every beat of my heart says your name, Aya.", "I adore everything about you, Aya.", "Meeting you was my best destiny.", "Always yours, Aya. ✨"];
        let idx = 0;
        function nextMsg() {
            document.getElementById('msg-display').innerText = msgs[idx];
            idx = (idx + 1) % msgs.length;
        }
    </script>
</body>
</html>
