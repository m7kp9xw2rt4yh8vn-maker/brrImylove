<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Aya - A Cinematic Gift</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #030303; background-image: radial-gradient(circle at 20% 20%, rgba(255, 77, 148, 0.08) 0%, transparent 40%), radial-gradient(circle at 80% 80%, rgba(138, 43, 226, 0.08) 0%, transparent 40%), linear-gradient(135deg, #090005 0%, #030303 100%); font-family: 'Poppins', sans-serif; color: #fff; overflow-x: hidden; text-align: center; }

        #intro-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: radial-gradient(circle, #1a0011 0%, #050003 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 1.2s ease; }
        #intro-screen h1 { font-family: 'Great Vibes', cursive; font-size: 3.5rem; color: #ff4d94; margin-bottom: 25px; text-shadow: 0 0 25px rgba(255,77,148,0.7); padding: 0 20px; }

        .enter-btn { background: rgba(255, 77, 148, 0.15); color: #fff; border: 2px solid #ff4d94; padding: 14px 40px; font-size: 1.2rem; font-family: 'Playfair Display', serif; border-radius: 50px; cursor: pointer; backdrop-filter: blur(5px); transition: 0.4s; }
        .enter-btn:hover { transform: scale(1.08); background: #ff4d94; box-shadow: 0 0 40px #ff4d94; }

        .falling-element { position: fixed; top: -50px; font-size: 20px; animation: fall linear infinite; z-index: 1; pointer-events: none; }
        @keyframes fall { 0% { transform: translateY(-5vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

        .heart-svg-container { width: 280px; height: 240px; margin: 30px auto 10px; position: relative; z-index: 2; }
        .heart-svg-container svg { width: 100%; height: 100%; overflow: visible; }
        .heart-text-path { font-family: 'Great Vibes', cursive; font-size: 18px; fill: #ff4d94; filter: drop-shadow(0 0 6px rgba(255,77,148,0.8)); }

        .name-wrapper { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 30px; z-index: 2; position: relative; }
        .aya-title { font-family: 'Great Vibes', cursive; font-size: 4.5rem; color: #ff4d94; text-shadow: 0 0 25px rgba(255,77,148,0.7); }
        .header-heart { font-size: 2.5rem; animation: heartbeat 1.5s infinite ease-in-out; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

        .glass-section { background: rgba(20, 10, 15, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 77, 148, 0.2); width: 90%; max-width: 700px; margin: 40px auto; padding: 30px 20px; border-radius: 20px; z-index: 2; box-shadow: 0 10px 30px rgba(0,0,0,0.4); opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
        .glass-section.visible { opacity: 1; transform: translateY(0); }
        
        .glass-section h2 { font-family: 'Great Vibes', cursive; color: #ff758c; font-size: 3rem; margin-bottom: 20px; }

        .media-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 15px; align-items: center; }
        
        /* -- تعديل سحري هنا: استبدال الخلفية البيضاء بـ Blur Glass -- */
        .polaroid { 
            /* إزالة الخلفية البيضاء والظل القديم */
            background: rgba(255, 255, 255, 0.05); 
            /* إضافة تأثير الزجاج الضبابي */
            backdrop-filter: blur(15px); 
            /* حدود خفيفة جداً */
            border: 1px solid rgba(255, 255, 255, 0.15);
            /* الظل الجديد ليتناسب مع الظلام */
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            padding: 10px 10px 30px 10px; 
            border-radius: 15px; 
            width: 200px; 
            transition: 0.4s; 
        }
        .polaroid:hover { transform: translateY(-10px) scale(1.03); box-shadow: 0 15px 40px rgba(255, 77, 148, 0.4); }
        .polaroid img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; /* إزالة الإطار الأبيض الداخلي */ }
        .polaroid p { margin-top: 12px; font-family: 'Playfair Display', serif; color: #eee; font-size: 1rem; text-shadow: 0 0 5px rgba(0,0,0,0.5); }
        /* -- نهاية التعديل -- */

        .video-box { width: 200px; height: 280px; border-radius: 15px; overflow: hidden; border: 2px solid rgba(255, 77, 148, 0.6); background: #000; box-shadow: 0 5px 20px rgba(255, 77, 148, 0.3); }
        .video-box video { width: 100%; height: 100%; object-fit: cover; display: block; }

        .chat-video-box { width: 240px; height: 440px; border-radius: 25px; overflow: hidden; border: 3px solid rgba(255, 77, 148, 0.8); box-shadow: 0 5px 25px rgba(255, 77, 148, 0.4); background: #000; margin: 0 auto; }
        .chat-video-box video { width: 100%; height: 100%; object-fit: fill; display: block; }

        .msg-btn { background: rgba(255, 77, 148, 0.12); color: #fff; border: 1px solid #ff4d94; padding: 8px 20px; margin: 5px; border-radius: 25px; cursor: pointer; font-family: 'Playfair Display', serif; font-size: 0.95rem; transition: 0.3s; }
        .msg-btn:active { background: #ff4d94; }
        #msg-display { margin-top: 15px; font-size: 1.2rem; color: #ffd1dc; font-style: italic; font-family: 'Playfair Display', serif; padding: 0 10px; }

        .floating-bubble { position: fixed; bottom: 20px; right: 20px; background: rgba(20, 10, 15, 0.9); border: 2px solid #ff4d94; color: #fff; padding: 10px 18px; border-radius: 25px; z-index: 998; cursor: pointer; box-shadow: 0 0 15px rgba(255,77,148,0.5); font-family: 'Playfair Display', serif; font-size: 0.9rem; }

        footer { padding: 25px; color: #777; font-family: 'Playfair Display', serif; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="intro-screen">
        <h1>A Special Universe For You... ❤️</h1>
        <button class="enter-btn" onclick="startExperience()">Click Here to Enter</button>
    </div>

    <audio id="bg-music" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-tenderness.mp3" type="audio/mp3">
    </audio>

    <div id="elements-container"></div>

    <div class="floating-bubble" onclick="randomFloatingMsg()">💌 Tap for Aya</div>

    <div class="heart-svg-container">
        <svg viewBox="0 0 300 280">
            <path id="heartPath" fill="none" d="M 150,50 C 150,20 100,0 60,30 C 20,60 10,110 50,150 L 150,240 L 250,150 C 290,110 280,60 240,30 C 200,20 150,50 150,50 Z" />
            <text>
                <textPath href="#heartPath" startOffset="0%" class="heart-text-path">
                    I love you   •   I love you   •   I love you   •   I love you   •   I love you   •   I love you   •   I love you
                </textPath>
            </text>
        </svg>
    </div>

    <div class="name-wrapper">
        <h1 class="aya-title">Aya</h1>
        <div class="header-heart">❤️</div>
    </div>

    <section class="glass-section">
        <h2>Secret Notes</h2>
        <button class="msg-btn" onclick="showMsg('You are my entire world and my safe place, Aya.')">About You</button>
        <button class="msg-btn" onclick="showMsg('I promise to always love and cherish you forever.')">My Promise</button>
        <div id="msg-display"></div>
    </section>

    <section class="glass-section">
        <h2>My Beautiful Princess</h2>
        <div class="media-grid">
            <!-- الصور الآن بخلفية زجاجية ضبابية -->
            <div class="polaroid"><img src="girl1.jpg"><p>Your lovely smile</p></div>
            <div class="polaroid"><img src="girl2.jpg"><p>The light of my days</p></div>
            <div class="video-box">
                <video autoplay muted loop playsinline>
                    <source src="girl-video.mp4" type="video/mp4">
                </video>
            </div>
        </div>
    </section>

    <section class="glass-section">
        <h2>Our Conversations</h2>
        <p style="font-family: 'Playfair Display', serif; margin-bottom: 15px; color: #ddd; font-size: 0.95rem;">The sweet chats that started it all...</p>
        <div class="chat-video-box">
            <video autoplay muted loop playsinline>
                <source src="chat-video.mp4" type="video/mp4">
            </video>
        </div>
    </section>

    <footer>
        <p>Made with all my heart for Aya ❤️</p>
    </footer>

    <script>
        function startExperience() {
            const intro = document.getElementById('intro-screen');
            const music = document.getElementById('bg-music');
            intro.style.opacity = '0';
            setTimeout(() => { intro.style.display = 'none'; }, 1000);
            music.play().catch(error => console.log(error));
            setInterval(createFallingElement, 600);
        }

        function showMsg(txt) { 
            document.getElementById('msg-display').innerText = txt; 
        }

        const floatingMsgs = [
            "Aya, you make my heart skip a beat every single day. 💖",
            "No matter where I go, my thoughts always lead back to you, Aya. ✨",
            "You are the best thing that has ever happened to me. 🌹",
            "My love for you grows stronger with every second. ❤️"
        ];
        function randomFloatingMsg() {
            alert(floatingMsgs[Math.floor(Math.random() * floatingMsgs.length)]);
        }

        function createFallingElement() {
            const symbols = ['❤️', '🌹', '🌸', '💖'];
            const el = document.createElement('div');
            el.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
            el.className = 'falling-element';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 3 + 5) + 's';
            document.getElementById('elements-container').appendChild(el);
            setTimeout(() => { el.remove(); }, 8000);
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.glass-section').forEach(section => {
            observer.observe(section);
        });
    </script>
</body>
</html>
